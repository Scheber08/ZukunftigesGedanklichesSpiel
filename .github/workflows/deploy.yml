# =============================================================================
# Deploy (Plan §7.2, §7.6, §11): statische Seiten aus der Datenbank bauen und den
# Cloudflare Worker ausrollen.
#
# Auslöser:
#   push auf main          → Code-Deploy (am Renntag gesperrt: Renntags-Freeze)
#   repository_dispatch    → Inhalts-Rebuild nach „Veröffentlichen“ im Admin
#     (type: publish)        (der Worker-Cron bündelt Änderungen, siehe src/lib/server/rebuild.ts)
#   schedule (täglich)     → Frische der statischen Seiten (Countdown-Startwerte,
#                            abgelaufene Protestfristen, geplante News)
#   workflow_dispatch      → manuell, optional mit Freeze-Ausnahme für Notfälle
#
# Renntags-Freeze: Repository-Variable RACEDAY_WEEKDAY (ISO-Wochentage, 1 = Montag …
# 7 = Sonntag, mehrere mit Komma, z. B. "4" oder "4,7") und optional FREEZE_DATES
# (z. B. "2026-12-19,2026-12-20"). An diesen Tagen (Europe/Berlin) werden Code-Deploys
# abgelehnt. Inhalts-Rebuilds laufen weiter, bauen dann aber den zuletzt ausgerollten
# Code-Stand (Git-Tag „production“) – so kommt kein neuer Code über die Hintertür live.
#
# Benötigt (Settings → Secrets and variables → Actions), sonst wird übersprungen:
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SUPABASE_URL, SUPABASE_ANON_KEY
#   Variablen: PUBLIC_SITE_URL, PUBLIC_TURNSTILE_SITE_KEY, DISCORD_GUILD_ID,
#              DISCORD_PUBLIC_KEY, DISCORD_APPLICATION_ID (Discord-Bot, optional),
#              SITE_NOINDEX (true während der geschlossenen Beta), RACEDAY_WEEKDAY, FREEZE_DATES
# Worker-Secrets (Service-Key, Bot-Token …) setzt man einmalig mit `wrangler secret put`,
# sie stehen bewusst NICHT in diesem Workflow (siehe docs/SETUP.md).
# =============================================================================
name: Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [publish]
  schedule:
    # täglich 03:41 UTC (≈ 05:41 Berliner Sommerzeit)
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      ignore_freeze:
        description: 'Renntags-Freeze ignorieren (nur im Notfall, z. B. Hotfix für einen Fehler in der Anmeldung)'
        type: boolean
        default: false

permissions:
  contents: read

# Nie zwei Deploys gleichzeitig. Ein laufender Deploy wird nicht abgebrochen; von den
# wartenden bleibt nur der neueste übrig (mehrere Veröffentlichungen → ein Build).
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  # ---------------------------------------------------------------------------
  plan:
    name: Freeze & Konfiguration prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      ref: ${{ steps.decide.outputs.ref }}
      kind: ${{ steps.decide.outputs.kind }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Entscheiden
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          IGNORE_FREEZE: ${{ github.event.inputs.ignore_freeze || 'false' }}
          RACEDAY_WEEKDAY: ${{ vars.RACEDAY_WEEKDAY }}
          FREEZE_DATES: ${{ vars.FREEZE_DATES }}
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_SUPABASE: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_ANON_KEY != '' }}
          DISPATCH_REASON: ${{ github.event.client_payload.reason }}
        run: |
          set -euo pipefail
          weekday=$(TZ=Europe/Berlin date +%u)
          today=$(TZ=Europe/Berlin date +%F)
          frozen=false
          days=",$(echo "${RACEDAY_WEEKDAY:-}" | tr -d ' '),"
          dates=",$(echo "${FREEZE_DATES:-}" | tr -d ' '),"
          if [[ "$days" == *",$weekday,"* || "$dates" == *",$today,"* ]]; then frozen=true; fi

          case "$EVENT" in
            push|workflow_dispatch) kind=code ;;
            *) kind=content ;;
          esac
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$IGNORE_FREEZE" = "true" ]; then frozen=false; fi

          deploy=true
          ref="$GITHUB_SHA"
          if [ "$HAS_CF_TOKEN" != "true" ] || [ "$HAS_SUPABASE" != "true" ]; then
            deploy=false
            echo "::notice::Deploy übersprungen: Secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SUPABASE_URL und SUPABASE_ANON_KEY sind noch nicht vollständig gesetzt (siehe docs/SETUP.md)."
          elif [ "$frozen" = "true" ] && [ "$kind" = "code" ]; then
            echo "::error title=Renntags-Freeze::Heute ($today) ist Renntag – Code-Deploys sind gesperrt. Inhalte werden weiter veröffentlicht. Notfall: Workflow manuell mit „Renntags-Freeze ignorieren“ starten."
            exit 1
          elif [ "$frozen" = "true" ]; then
            if git rev-parse -q --verify "refs/tags/production" >/dev/null; then
              ref=$(git rev-parse "refs/tags/production^{commit}")
              echo "::notice::Renntag: Inhalts-Rebuild mit dem ausgerollten Code-Stand ${ref:0:7} (Tag production)."
            else
              echo "::warning::Renntag, aber kein Tag „production“ vorhanden – baue main."
            fi
          fi

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          {
            echo "### Deploy-Plan"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Auslöser | $EVENT${DISPATCH_REASON:+ ($DISPATCH_REASON)} |"
            echo "| Art | $kind |"
            echo "| Renntag heute | $frozen (Wochentag $weekday, $today) |"
            echo "| Code-Stand | ${ref:0:7} |"
            echo "| Deploy | $deploy |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  deploy:
    name: Build & Deploy
    needs: plan
    if: ${{ needs.plan.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ vars.PUBLIC_SITE_URL }}
    # Nur lesen: Der Tag „production“ wird im eigenen Job „tag“ gesetzt – so hat kein Schritt,
    # der fremden Code ausführt (npm ci, Build), ein Token mit Schreibrecht aufs Repository.
    permissions:
      contents: read
    env:
      # --- Build-Zeit (öffentlich bzw. ins Server-Bundle eingebettet) ---
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
      # Discord-Bot (Interactions-Endpunkt); leer = Bot-Befehle aus
      DISCORD_PUBLIC_KEY: ${{ vars.DISCORD_PUBLIC_KEY }}
      DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
      SITE_NOINDEX: ${{ vars.SITE_NOINDEX || 'false' }}
      DEMO_MODE: 'false'
      # GITHUB_REPOSITORY setzt GitHub Actions automatisch (Ziel des Rebuild-Dispatch)
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Unit-Tests (nur bei Code-Deploys)
        if: ${{ needs.plan.outputs.kind == 'code' }}
        env:
          DEMO_MODE: 'true'
        run: npm test
      - name: Build (statische Seiten aus Supabase)
        run: npm run build
      # Der Cloudflare-Token steht nur in diesem Schritt – nicht in npm ci oder im Build.
      - name: Worker ausrollen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KIND: ${{ needs.plan.outputs.kind }}
          REASON: ${{ github.event.client_payload.reason || github.event_name }}
          REF: ${{ needs.plan.outputs.ref }}
        run: |
          npx wrangler deploy --message "${KIND} – ${REASON} (${REF:0:7})"
      # Statische Seiten, Worker (Admin-Login rendert serverseitig) und Kalender-Abo
      - name: Smoke-Test
        if: ${{ vars.PUBLIC_SITE_URL != '' }}
        env:
          SITE: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          sleep 10
          for path in / /kalender /wertung /en /kalender.ics /admin/login; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "${SITE%/}${path}")
            echo "${path} → ${code}"
            if [ "$code" != "200" ]; then echo "::error::Smoke-Test ${path} liefert ${code}"; exit 1; fi
          done

  # ---------------------------------------------------------------------------
  tag:
    name: Tag „production“ setzen
    needs: [plan, deploy]
    # Merkt sich den ausgerollten Code-Stand – Inhalts-Rebuilds am Renntag bauen genau diesen.
    if: ${{ needs.deploy.result == 'success' && (needs.plan.outputs.kind == 'code' || needs.plan.outputs.ref == github.sha) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - name: Tag „production“ auf den ausgerollten Code-Stand setzen
        env:
          REF: ${{ needs.plan.outputs.ref }}
        run: |
          git tag -f production "$REF"
          git push -f origin refs/tags/production
