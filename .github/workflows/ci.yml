# =============================================================================
# CI (Plan §7.6): Lint + Typecheck, Unit-Tests, Seed-Prüfung, Build, Datenbank-Test
# (Migrationen + Seeds + RLS), Playwright-E2E mit axe und Link-Check, Lighthouse-Budget
# und Preview-Deployment pro Pull Request.
#
# Alles läuft im Demo-Modus (DEMO_MODE=true) mit den Beispieldaten aus
# src/lib/seed/demo.ts – die CI braucht keine Secrets und fasst nie die
# Produktionsdatenbank an. Einzige Ausnahme: das Preview-Deployment braucht
# CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID und wird ohne sie übersprungen.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  DEMO_MODE: 'true'
  SITE_NOINDEX: 'true'
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  # ---------------------------------------------------------------------------
  check:
    name: Lint, Typecheck & Unit-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint & Typecheck (astro check + svelte-check)
        run: npm run lint
      - name: Unit-Tests (Vitest)
        run: npm test
      - name: supabase/seed.sql aktuell?
        run: npm run db:seed:check

  # ---------------------------------------------------------------------------
  build:
    name: Build (Demo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build im Demo-Modus
        run: npm run build
      - name: Größe der statischen Seiten
        run: |
          {
            echo '### Build-Ergebnis'
            echo
            echo "- HTML-Seiten: $(find dist/client -name '*.html' | wc -l)"
            echo "- dist/client gesamt: $(du -sh dist/client | cut -f1)"
            echo "- JavaScript gesamt (unkomprimiert): $(find dist/client -name '*.js' -exec cat {} + | wc -c) Bytes"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Statische Seiten für Lighthouse bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: dist-client
          path: dist/client
          retention-days: 3

  # ---------------------------------------------------------------------------
  database:
    name: Datenbank (Migrationen, Seeds, RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Supabase-Umgebung nachbilden (Rollen, Rechte, Storage)
        run: psql -v ON_ERROR_STOP=1 -q -f .github/scripts/db-supabase-stub.sql
      - name: Migrationen einspielen
        run: |
          for f in supabase/migrations/*.sql; do
            echo "::group::$f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done
      - name: seed.sql einspielen (zweimal – muss wiederholbar sein)
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
      - name: Basisdaten prüfen
        run: psql -v ON_ERROR_STOP=1 -q -f .github/scripts/db-check-base.sql
      - name: demo.sql frisch erzeugen und einspielen (zweimal)
        run: |
          node --experimental-strip-types scripts/generate-seed-sql.ts --demo
          psql -v ON_ERROR_STOP=1 -q -f supabase/demo.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/demo.sql
      - name: Demo-Daten und Row Level Security prüfen
        run: psql -v ON_ERROR_STOP=1 -q -f .github/scripts/db-check-demo.sql

  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright + axe + Link-Check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Chromium installieren
        run: npx playwright install --with-deps chromium
      # playwright.config.ts baut selbst (astro build, DEMO_MODE=true) und startet `astro preview`
      # auf Port 4322 – getestet wird also der Produktions-Build mit Worker (workerd).
      # Enthält den Link-Check (tests/e2e/links.spec.ts): crawlt alle internen Links, Ressourcen
      # und #Sprungziele über den echten Server (statische Assets + Worker wie auf Cloudflare).
      - name: Playwright-Tests inkl. Link-Check (Build + Preview im Demo-Modus auf Port 4322)
        run: npm run test:e2e
      - name: Bericht hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  lighthouse:
    name: Lighthouse-Budget
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Budget-Verletzungen sind eine Warnung, kein Blocker (Plan §10)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: dist-client
          path: dist/client
      - name: Lighthouse CI (JS < 50 KB, Seite < 300 KB, LCP < 2 s, CLS < 0,05)
        run: npx --yes @lhci/cli@0.15.x autorun --config=./lighthouserc.json
      - name: Berichte hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  preview:
    name: Preview-Deployment
    if: ${{ github.event_name == 'pull_request' }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare-Zugang vorhanden?
        id: cf
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Kein CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID (z. B. Pull Request aus einem Fork) – Preview wird übersprungen."
          fi
      - if: steps.cf.outputs.enabled == 'true'
        uses: actions/checkout@v5
      - if: steps.cf.outputs.enabled == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - if: steps.cf.outputs.enabled == 'true'
        run: npm ci
      - name: Build im Demo-Modus (Previews zeigen nie echte Daten)
        if: steps.cf.outputs.enabled == 'true'
        run: npm run build
      - name: Worker-Version mit Preview-Alias hochladen (ohne Produktiv-Deploy)
        if: steps.cf.outputs.enabled == 'true'
        id: upload
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          npx wrangler versions upload \
            --preview-alias "pr-${PR_NUMBER}" \
            --tag "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER} (${PR_SHA:0:7})" 2>&1 | tee wrangler-output.txt
          url=$(grep -oE "https://pr-${PR_NUMBER}-[a-z0-9.-]+\.workers\.dev" wrangler-output.txt | head -n1 || true)
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          {
            echo '### Preview'
            echo
            if [ -n "$url" ]; then echo "Demo-Vorschau: $url"; else echo 'Version hochgeladen – URL siehe Log (Preview-URLs im Worker aktivieren, siehe docs/SETUP.md).'; fi
          } >> "$GITHUB_STEP_SUMMARY"
      # Ein Kommentar pro Pull Request (erkennbar am Marker), bei jedem Push aktualisiert –
      # auch wenn der erste Lauf noch ohne Cloudflare-Zugang war.
      - name: Link im Pull Request posten bzw. aktualisieren
        if: steps.cf.outputs.enabled == 'true' && steps.upload.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        run: |
          set -euo pipefail
          marker='<!-- liga-preview -->'
          body="${marker}
          **Vorschau** (Demo-Daten, noindex): ${PREVIEW_URL}
          Stand: ${PR_SHA:0:7} – die Adresse bleibt für alle weiteren Commits in diesem Pull Request gleich."
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id")
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" > /dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
